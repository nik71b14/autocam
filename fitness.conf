# autocam fitness evaluator — default parameters.
# Format: key = value.  '#' starts a comment.  Lower total fitness = better gene.
# Pass a different file with:  autocam fitness ... --config myfitness.conf
# See DOCS/MANUAL.md ("Fitness evaluator") for the full explanation of each term.

# --- Accuracy (dominant): how well the carved stock matches the target part ----
# GOUGE  = target present but material removed  -> irreversible, near hard-constraint.
# EXCESS = leftover material where the part is empty -> recoverable, just minimise it.
w_gouge        = 1000.0    # penalty per gouged voxel
w_excess       = 1.0       # penalty per excess (leftover) voxel

# --- Cycle time: subsumes path length, air moves and (via corner decel) sharp turns
w_time         = 1.0       # penalty per second of estimated cycle time
rapid_feed     = 5000.0    # rapid / air-move speed, mm/min (time model)
default_feed   = 400.0     # feed for a cutting move with no explicit F, mm/min
corner_decel_s = 0.05      # seconds added per full 180-deg reversal (scaled by turn angle)

# --- Safety (tool breakage / wear): peak material removal per unit of advance ---
# engagement = voxels removed on a segment / advance in voxels (~ chip cross-section).
w_engage       = 5.0       # penalty per unit of engagement above e_break (summed over segments)
e_break        = 300.0     # engagement above this risks breaking the tool

# --- Smoothness (surface finish): FREQUENCY of abrupt direction changes ---------
# A frequency (turns per mm of cutting), so long smooth passes (boustrophedon,
# spiral) are NOT penalised; only jittery paths with many sharp turns are.
w_turn         = 10.0      # penalty per (abrupt turn / mm of cutting)
turn_angle_deg = 60.0      # a direction change sharper than this counts as "abrupt"

# --- Parsimony (optional; 0 disables) ------------------------------------------
w_air          = 0.0       # extra penalty per mm of air (non-cutting) travel
w_moves        = 0.0       # penalty per toolpath move (gene length)
