    .wg             { stroke: #1a4fb0; stroke-width: 1.6; fill: none; }
    .thread         { fill: #b7e3bd; stroke: #3a9d4a; stroke-width: 1.6; }
    .dim            { stroke: #4b5563; stroke-width: 1; fill: none; }
    .axis           { stroke: #7a8ca0; stroke-width: 1.1; fill: none; }
    .lbl            { font-size: 11.5px; fill: #374151; }
    .lbl-b          { font-size: 11.5px; font-weight: 700; fill: #1a4fb0; }
    .note           { font-size: 10.5px; fill: #6b7280; }
