       x="602"
       y="346"
       id="text35">gx = baseX + gl_GlobalInvocationID.x</text>
    <text
       class="mono"
       x="602"
       y="362"
       id="text36">gy = baseY + gl_GlobalInvocationID.y</text>
    <text
       class="note"
       x="602"
       y="384"
       id="text37">local_size = (8, 8, 1); the column is bounds-</text>
    <text
       class="note"
       x="602"
       y="398"
       id="text38">checked against W and H before anything else</text>
  </g>
