  <title
     id="title1">Figure 5 - Mapping compute threads onto the workpiece column grid</title>
  <desc
     id="desc1">(a) Top view of the W by H column grid: the host restricts the dispatch to the swept bounding box, the AABB of the two segment endpoints dilated by half the tool footprint. (b) The bounding box is tiled into 8 by 8 workgroups; rounding up leaves an overhang, part of which lies outside the workpiece and returns immediately. (c) One workgroup is 8 by 8 threads, and each thread handles one column recovered from its global invocation ID.</desc>
  <!-- ============================================================
       EDIT HERE: colours and fonts in the style block below.
       Panel (a): grid cell 18 px, 13 x 10 cells from (46,130).
         swept band endpoints (113,179)-(213,243), F = 26,
         so the bbox is exactly [100,226] x [166,256].
       Panel (b): cell 9 px, 24 x 16 dispatched columns from (348,150);
         bbox = 20 x 13 columns, workpiece edge at column 22 / row 14,
         workgroup borders every 8 cells = 72 px.
       ============================================================ -->
  <style
