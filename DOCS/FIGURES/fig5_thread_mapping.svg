    .band           { stroke: #f0a35e; stroke-opacity: 0.85; stroke-width: 26; stroke-linecap: round; fill: none; }
    .seg            { stroke: #b45309; stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
    .node           { fill: #b45309; }
