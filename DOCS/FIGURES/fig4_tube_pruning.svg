<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="815"
   height="341"
   viewBox="0 0 815 341"
   font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif"
   version="1.1"
   id="svg36"
   sodipodi:docname="fig4_tube_pruning.svg"
   inkscape:version="1.4.4 (dcaf3e7d9e, 2026-05-05)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
   xmlns:cc="http://creativecommons.org/ns#"
   xmlns:dc="http://purl.org/dc/elements/1.1/">
  <sodipodi:namedview
     id="namedview36"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="1.3806818"
     inkscape:cx="402.33745"
     inkscape:cy="144.49383"
     inkscape:window-width="2560"
     inkscape:window-height="1465"
     inkscape:window-x="0"
     inkscape:window-y="0"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg36" />
  <title
     id="title1">Figure 4 - Tube pruning</title>
  <desc
     id="desc1">(a) Top view of a diagonal segment: the dispatch AABB is far larger than the swept band it contains, so most dispatched columns are no-ops. (b) Columns written per segment, with and without pruning, for the geometry drawn in (a). (c) An in-air rapid, seen in section: the removed interval lies entirely above the stock, so every column early-outs and the whole segment is skipped on the host.</desc>
  <!-- ============================================================
       EDIT HERE: colours and fonts in the style block below.
       Panel (a) geometry: endpoints p0 = (108,148), p1 = (248,288);
       tool footprint F = 30 (band stroke-width), so
         L  = |p1 - p0| = 198       band  ~ L*F      =  5940
         AABB = 170 x 170 = 28900   band+caps        =  6647
       The bar lengths in panel (b) are in that same ratio (23 %).
       Change the endpoints or F and both panels must be redone.
       ============================================================ -->
  <style
     id="style1">
    text          { fill: #1f2937; }
    .title        { font-size: 17px; font-weight: 700; }
    .subtitle     { font-size: 12px; fill: #5b7fa6; }
    .panel        { fill: #f2f7fc; stroke: #dbe6f0; stroke-width: 1; }
    .ptitle       { font-size: 12.5px; font-weight: 700; fill: #1f2937; }
    .aabb         { fill: #e8710a; fill-opacity: 0.07; stroke: #b45309; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .band         { stroke: #cfe3f7; stroke-opacity: 0.95; stroke-width: 30; stroke-linecap: round; fill: none; }
    .band-edge    { stroke: #1a73c8; stroke-opacity: 0.9; stroke-width: 31.6; stroke-linecap: round; fill: none; }
    .seg          { stroke: #1a4fb0; stroke-width: 1.2; stroke-dasharray: 5 3; fill: none; }
    .node         { fill: #1a4fb0; }
    .dim          { stroke: #4b5563; stroke-width: 1; fill: none; }
    .stock        { fill: #b7e3bd; fill-opacity: 0.85; stroke: #3a9d4a; stroke-width: 1.5; }
    .tool         { fill: #bcd8f5; fill-opacity: 0.9; stroke: #1a73c8; stroke-width: 1.5; }
    .guide        { stroke: #8a97a4; stroke-width: 1; stroke-dasharray: 5 4; fill: none; }
    .bar-full     { fill: #f0a35e; fill-opacity: 0.85; stroke: #e8710a; stroke-width: 1.3; }
    .bar-band     { fill: #bcd8f5; fill-opacity: 0.95; stroke: #1a73c8; stroke-width: 1.4; }
    .lbl          { font-size: 11.5px; fill: #374151; }
    .lbl-o        { font-size: 11.5px; font-weight: 700; fill: #b45309; }
    .lbl-b        { font-size: 11.5px; font-weight: 700; fill: #1a4fb0; }
    .note         { font-size: 11px; fill: #6b7280; }
    .mono         { font-size: 11px; font-family: &quot;DejaVu Sans Mono&quot;, Consolas, monospace; fill: #374151; }
  </style>
  <defs
     id="defs1">
    <marker
       id="d1"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="5"
       markerHeight="5"
       orient="auto-start-reverse">
      <path
         d="M 0,0 10,5 0,10 Z"
         fill="#4b5563"
         id="path1" />
    </marker>
  </defs>
  <!-- ===================== TITLE ===================== -->
  <!-- ============ PANEL A: top view, AABB versus swept band ============ -->
  <rect
     class="panel"
     x="6.5"
     y="6.5"
     width="330"
     height="330"
     rx="4"
     id="rect2" />
  <text
     class="ptitle"
     x="173.5"
     y="30.5"
     text-anchor="middle"
     id="text3">One diagonal segment, seen from above (X–Y)</text>
  <rect
     class="aabb"
     x="71.5"
     y="63.5"
     width="170"
     height="170"
     id="rect3" />
  <line
     class="band-edge"
     x1="86.5"
     y1="78.5"
     x2="226.5"
     y2="218.5"
     id="line3" />
  <line
     class="band"
     x1="86.5"
     y1="78.5"
     x2="226.5"
     y2="218.5"
     id="line4" />
  <line
     class="seg"
     x1="86.5"
     y1="78.5"
     x2="226.5"
     y2="218.5"
     id="line5" />
  <circle
     class="node"
     cx="86.5"
     cy="78.5"
     r="3.5"
     id="circle5" />
  <circle
     class="node"
     cx="226.5"
     cy="218.5"
     r="3.5"
     id="circle6" />
  <text
     class="lbl-b"
     x="64.5"
     y="72.5"
     text-anchor="end"
     font-family="'DejaVu Sans', sans-serif"
     id="text6">p₀</text>
  <text
     class="lbl-b"
     x="246.5"
     y="230.5"
     font-family="'DejaVu Sans', sans-serif"
     id="text7">p₁</text>
  <text
     class="lbl-o"
     x="241.5"
     y="57.5"
     text-anchor="end"
     id="text8">dispatch AABB</text>
  <text
     class="lbl"
     x="206.5"
     y="106.5"
     text-anchor="middle"
     id="text9">off-band:</text>
  <text
     class="lbl"
     x="206.5"
     y="120.5"
     text-anchor="middle"
     id="text10">never covered</text>
  <text
     class="lbl"
     x="106.5"
     y="192.5"
     text-anchor="middle"
     id="text11">off-band</text>
  <g
     id="f-dim"
     transform="translate(-21.5,-69.5)">
    <line
       class="dim"
       x1="196"
       y1="216"
       x2="217"
       y2="195"
       marker-start="url(#d1)"
       marker-end="url(#d1)"
       id="line11" />
    <text
       class="lbl"
       x="228"
       y="216"
       id="text12">F</text>
  </g>
  <text
     class="lbl"
     x="104.5"
     y="134.5"
     text-anchor="middle"
     id="text13">L</text>
  <text
     class="lbl"
     x="171.5"
     y="266.5"
     text-anchor="middle"
     id="text14">AABB ≈ (0.7 L + F)² columns · band ≈ L · F columns</text>
  <text
     class="note"
     x="171.5"
     y="286.5"
     text-anchor="middle"
     id="text15">L = segment length, F = tool footprint</text>
  <text
     class="note"
     x="171.5"
     y="308.5"
     text-anchor="middle"
     id="text16">an axis-aligned segment is the degenerate case:</text>
  <text
     class="note"
     x="171.5"
     y="322.5"
     text-anchor="middle"
     id="text17">the AABB already equals the band</text>
  <!-- ============ PANEL B: columns written ============ -->
  <g
     id="panel-traffic"
     transform="translate(-21.5,-69.5)">
    <rect
       class="panel"
       x="370"
       y="76"
       width="260"
       height="330"
       rx="4"
       id="rect17" />
    <text
       class="ptitle"
       x="500"
       y="100"
       text-anchor="middle"
       id="text18">Columns written per segment</text>
    <text
       class="lbl-o"
       x="386"
       y="152"
       id="text19">without pruning: the whole AABB</text>
    <rect
       class="bar-full"
       x="386"
       y="160"
       width="228"
       height="26"
       id="rect19" />
    <text
       class="note"
       x="386"
       y="204"
       id="text20">every dispatched column rewrites 32 slots</text>
    <text
       class="lbl-b"
       x="386"
       y="250"
       id="text21">with pruning: only the band</text>
    <rect
       class="bar-band"
       x="386"
       y="258"
       width="52"
       height="26"
       id="rect21" />
    <text
       class="note"
       x="386"
       y="302"
       id="text22">the rest return before the write-back</text>
    <text
       class="lbl"
       x="500"
       y="336"
       text-anchor="middle"
       id="text23">≈ 4.3 × fewer columns written here</text>
    <text
       class="note"
       x="500"
       y="358"
       text-anchor="middle"
       id="text24">the ratio is geometric: it grows with L / F</text>
    <text
       class="note"
       x="500"
       y="380"
       text-anchor="middle"
       id="text25">skipped columns are left untouched, so the</text>
    <text
       class="note"
       x="500"
       y="394"
       text-anchor="middle"
       id="text26">carved result is byte-identical</text>
  </g>
  <!-- ============ PANEL C: in-air rapid ============ -->
  <g
     id="panel-inair"
     transform="translate(-21.5,-69.5)">
    <rect
       class="panel"
       x="642"
       y="76"
       width="190"
       height="330"
       rx="4"
       id="rect26" />
    <text
       class="ptitle"
       x="737"
       y="100"
       text-anchor="middle"
       id="text27">In-air rapid</text>
    <!-- tool above the stock -->
    <path
       class="tool"
       d="m 715,140 v 50 a 22,22 0 0 0 44,0 v -50 z"
       id="path27" />
    <!-- removed interval, entirely above the stock -->
    <g
       id="interval">
      <line
         class="dim"
         x1="774"
         y1="140"
         x2="774"
         y2="212"
         marker-start="url(#d1)"
         marker-end="url(#d1)"
         id="line27" />
      <line
         class="dim"
         x1="769"
         y1="140"
         x2="779"
         y2="140"
         id="line28" />
      <line
         class="dim"
         x1="769"
         y1="212"
         x2="779"
         y2="212"
         id="line29" />
      <text
         class="note"
         x="782"
         y="180"
         id="text29">removed</text>
      <text
         class="note"
         x="782"
         y="194"
         id="text30">interval</text>
    </g>
    <!-- stock -->
    <rect
       class="stock"
       x="662"
       y="250"
       width="150"
       height="70"
       id="rect30" />
    <line
       class="guide"
       x1="656"
       y1="250"
       x2="818"
       y2="250"
       id="line30" />
    <text
       class="note"
       x="812"
       y="245"
       text-anchor="end"
       id="text31">z_top</text>
    <text
       class="note"
       x="812"
       y="316"
       text-anchor="end"
       id="text32">z = 0</text>
    <text
       class="note"
       x="737"
       y="348"
       text-anchor="middle"
       id="text33">the interval lies entirely above</text>
    <text
       class="note"
       x="737"
       y="362"
       text-anchor="middle"
       id="text34">the stock, so every column</text>
    <text
       class="note"
       x="737"
       y="376"
       text-anchor="middle"
       id="text35">early-outs and the segment is</text>
    <text
       class="note"
       x="737"
       y="390"
       text-anchor="middle"
       id="text36">skipped on the host</text>
  </g>
  <text
     class="lbl"
     x="17.5625"
     y="22.640625"
     text-anchor="middle"
     id="text6-9"
     style="font-size:16px;fill:#374151">a)</text>
  <text
     class="lbl"
     x="360.5625"
     y="21.640625"
     text-anchor="middle"
     id="text6-9-3"
     style="font-size:16px;fill:#374151">b)</text>
  <text
     class="lbl"
     x="632.5625"
     y="21.640625"
     text-anchor="middle"
     id="text6-9-3-2"
     style="font-size:16px;fill:#374151">c)</text>
  <metadata
     id="metadata36">
    <rdf:RDF>
      <cc:Work
         rdf:about="">
        <dc:title>Figure 4 - Tube pruning</dc:title>
      </cc:Work>
    </rdf:RDF>
  </metadata>
</svg>
