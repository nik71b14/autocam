  <title
     id="title1">Figure 2 - Stamping versus swept subtraction</title>
  <desc
     id="desc1">Section through the tool axis. Left: the ball-end mill stamped at successive jog positions, one dispatch each, leaving ridges of uncut material between consecutive stamps. Right: a single subtraction of the swept volume over the whole segment, giving a flat floor and hemispherical ends; the tool is shown transparent at the start of the move and solid at the end.</desc>
  <!-- ============================================================
       EDIT HERE: colours, fonts and strokes are centralised below.
       Geometry (panel-local coordinates):
         tool radius R = 22 ; hemisphere centre y = 118 ; floor y = 140
         jog step s = 36 ; ridge crest y = 130.65 = 118 + sqrt(R^2 - (s/2)^2)
         stamp centres x = 82, 118, 154, 190, 226, 262, 298
       If R or s change, the ridge crest and every arc endpoint change too.
       ============================================================ -->
  <style
     id="style1">
    text            { fill: #1f2937; }
    .title          { font-size: 17px; font-weight: 700; }
    .subtitle       { font-size: 12px; fill: #5b7fa6; }
    .panel          { fill: #f2f7fc; stroke: #dbe6f0; stroke-width: 1; }
    .ptitle-o       { font-size: 13.5px; font-weight: 700; fill: #e8710a; }
    .ptitle-b       { font-size: 13.5px; font-weight: 700; fill: #1a73c8; }
    .stock          { fill: #b7e3bd; fill-opacity: 0.85; stroke: #3a9d4a; stroke-width: 1.6; }
    .cut            { fill: #f2f7fc; stroke: #3a9d4a; stroke-width: 1.6; }
    .tool-ghost-o   { fill: #e8710a; fill-opacity: 0.06; stroke: #e8710a; stroke-width: 1; stroke-opacity: 0.5; }
    .tool-solid-o   { fill: #f6c08a; fill-opacity: 0.92; stroke: #e8710a; stroke-width: 1.6; }
    .tool-ghost-b   { fill: #1a73c8; fill-opacity: 0.07; stroke: #1a73c8; stroke-width: 1.1; stroke-opacity: 0.5; stroke-dasharray: 5 3; }
    .tool-solid-b   { fill: #aecff2; fill-opacity: 0.92; stroke: #1a73c8; stroke-width: 1.6; }
    .depth          { stroke: #8a97a4; stroke-width: 1; stroke-dasharray: 5 4; fill: none; }
    .dim            { stroke: #4b5563; stroke-width: 1; fill: none; }
    .motion         { stroke: #1a73c8; stroke-width: 1.5; fill: none; stroke-dasharray: 7 4; }
    .node-b         { fill: #1a73c8; }
    .lead           { stroke: #6b7280; stroke-width: 0.9; fill: none; }
    .lbl            { font-size: 11.5px; fill: #374151; }
    .lbl-o          { font-size: 12.5px; font-weight: 700; fill: #e8710a; }
    .lbl-b          { font-size: 12.5px; font-weight: 700; fill: #1a73c8; }
    .note           { font-size: 11px; fill: #6b7280; }
  </style>
