    .cell-hi-orange { fill: #fde3c4; stroke: #e8933a; stroke-width: 1.2; }
    .cell-text      { font-size: 12.5px; fill: #374151; text-anchor: middle; }
    .box-orange     { fill: #fffaf2; stroke: #e8710a; stroke-width: 1.6; }
    .box-blue       { fill: #eef5fd; stroke: #1a73c8; stroke-width: 1.6; }
    .txt-orange     { font-size: 12px; fill: #e8710a; font-weight: 700; }
