  <title
     id="title1">Figure 1 - Z-transition column representation (single-axis dexel)</title>
  <desc
     id="desc1">Left: X-Z cross-section of the stock with one column and its two Z-transitions. Right: the two flat arrays (compressedData, prefixSumData), the parity-walk occupancy rule and the key properties.</desc>
