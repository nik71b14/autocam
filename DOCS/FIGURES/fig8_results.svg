<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="880" height="320" fill="#ffffff"/>
  <text x="30" y="30" font-size="19" font-weight="bold" fill="#1a202c">Net carving time, normalized to the fused S2 baseline (lower = faster)</text>
  <text x="30" y="50" font-size="12.5" fill="#4a5568">Intel Lunar Lake / iris, interleaved mean of N, byte-identical. Control: 256-voxel tool; diagonal micro-benchmarks: 32-voxel tool.</text>

  <!-- legend -->
  <rect x="30" y="62" width="14" height="14" fill="#a0aec0"/><text x="50" y="74" font-size="12" fill="#1a202c">S2 baseline (fused, no pruning)</text>
  <rect x="290" y="62" width="14" height="14" fill="#38a169"/><text x="310" y="74" font-size="12" fill="#1a202c">S3 (+ tube pruning + air-skip)</text>

  <!-- axis + gridlines (0,50,100%) -->
  <line x1="250" y1="92" x2="250" y2="290" stroke="#718096" stroke-width="1.4"/>
  <line x1="487" y1="92" x2="487" y2="290" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="725" y1="92" x2="725" y2="290" stroke="#e2e8f0" stroke-width="1"/>
  <text x="250" y="304" font-size="11" fill="#718096" text-anchor="middle">0%</text>
  <text x="487" y="304" font-size="11" fill="#718096" text-anchor="middle">50%</text>
  <text x="725" y="304" font-size="11" fill="#718096" text-anchor="middle">100% (baseline)</text>

  <!-- Group 1: square_600 (axis control) -->
  <text x="244" y="122" font-size="12.5" font-weight="bold" fill="#1a202c" text-anchor="end">square_600</text>
  <text x="244" y="138" font-size="10.5" fill="#718096" text-anchor="end">(axis control)</text>
  <rect x="250" y="108" width="475" height="18" fill="#a0aec0"/>
  <rect x="250" y="128" width="375" height="18" fill="#38a169"/><text x="631" y="142" font-size="11" fill="#276749">1.27×</text>

  <!-- Group 2: diag_cut -->
  <text x="244" y="180" font-size="12.5" font-weight="bold" fill="#1a202c" text-anchor="end">diag_cut</text>
  <rect x="250" y="166" width="475" height="18" fill="#a0aec0"/>
  <rect x="250" y="186" width="139" height="18" fill="#38a169"/><text x="395" y="200" font-size="11" font-weight="bold" fill="#276749">3.43×</text>

  <!-- Group 3: air_moves -->
  <text x="244" y="238" font-size="12.5" font-weight="bold" fill="#1a202c" text-anchor="end">air_moves</text>
  <rect x="250" y="224" width="475" height="18" fill="#a0aec0"/>
  <rect x="250" y="244" width="57" height="18" fill="#38a169"/><text x="313" y="258" font-size="11" font-weight="bold" fill="#276749">8.38×</text>

  <text x="30" y="316" font-size="11.5" fill="#718096">Tube pruning wins big on diagonal/air work; even the axis control gains (256-voxel tool: its approach/retract rapids are air-skipped).</text>
</svg>
