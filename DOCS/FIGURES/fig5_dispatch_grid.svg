<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <text x="30" y="32" font-size="20" font-weight="bold" fill="#1a202c">Mapping compute threads onto the workpiece column grid</text>

  <!-- ============ LEFT: workpiece top view (X-Y), swept bbox ============ -->
  <text x="245" y="62" font-size="13" fill="#4a5568" text-anchor="middle">workpiece: W×H columns — top view (X–Y)</text>
  <!-- grid 10 x 7 -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="60" y1="80" x2="60" y2="346"/><line x1="97" y1="80" x2="97" y2="346"/><line x1="134" y1="80" x2="134" y2="346"/>
    <line x1="171" y1="80" x2="171" y2="346"/><line x1="208" y1="80" x2="208" y2="346"/><line x1="245" y1="80" x2="245" y2="346"/>
    <line x1="282" y1="80" x2="282" y2="346"/><line x1="319" y1="80" x2="319" y2="346"/><line x1="356" y1="80" x2="356" y2="346"/>
    <line x1="393" y1="80" x2="393" y2="346"/><line x1="430" y1="80" x2="430" y2="346"/>
    <line x1="60" y1="80" x2="430" y2="80"/><line x1="60" y1="118" x2="430" y2="118"/><line x1="60" y1="156" x2="430" y2="156"/>
    <line x1="60" y1="194" x2="430" y2="194"/><line x1="60" y1="232" x2="430" y2="232"/><line x1="60" y1="270" x2="430" y2="270"/>
    <line x1="60" y1="308" x2="430" y2="308"/><line x1="60" y1="346" x2="430" y2="346"/>
  </g>
  <!-- swept bbox highlight -->
  <rect x="134" y="118" width="185" height="152" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2"/>
  <text x="226" y="112" font-size="11" fill="#2b6cb0" text-anchor="middle">swept bbox  [baseX,endX] × [baseY,endY]</text>
  <!-- tool at start & end + band -->
  <line x1="171" y1="156" x2="282" y2="232" stroke="#c05621" stroke-width="30" stroke-opacity="1" stroke-linecap="round" opacity="1"/>
  <line x1="171" y1="156" x2="282" y2="232" stroke="#feebc8" stroke-width="26" stroke-linecap="round"/>
  <circle cx="171" cy="156" r="16" fill="none" stroke="#c05621" stroke-width="2"/>
  <circle cx="282" cy="232" r="16" fill="none" stroke="#c05621" stroke-width="2"/>
  <text x="150" y="150" font-size="10" fill="#c05621">tool@p0</text>
  <text x="290" y="236" font-size="10" fill="#c05621">tool@p1</text>
  <text x="245" y="366" font-size="11" fill="#718096" text-anchor="middle">one dispatch covers the whole bbox</text>
  <!-- axes -->
  <text x="437" y="84" font-size="12" fill="#4a5568">X →</text>
  <text x="44" y="120" font-size="12" fill="#4a5568" transform="rotate(-90 44 120)">Y ↓</text>

  <!-- ============ RIGHT: one 8x8 workgroup ============ -->
  <text x="660" y="62" font-size="13" fill="#4a5568" text-anchor="middle">one workgroup = 8×8 threads</text>
  <g stroke="#cbd5e0" stroke-width="1">
    <line x1="560" y1="80" x2="560" y2="304"/><line x1="588" y1="80" x2="588" y2="304"/><line x1="616" y1="80" x2="616" y2="304"/>
    <line x1="644" y1="80" x2="644" y2="304"/><line x1="672" y1="80" x2="672" y2="304"/><line x1="700" y1="80" x2="700" y2="304"/>
    <line x1="728" y1="80" x2="728" y2="304"/><line x1="756" y1="80" x2="756" y2="304"/><line x1="784" y1="80" x2="784" y2="304"/>
    <line x1="560" y1="80" x2="784" y2="80"/><line x1="560" y1="108" x2="784" y2="108"/><line x1="560" y1="136" x2="784" y2="136"/>
    <line x1="560" y1="164" x2="784" y2="164"/><line x1="560" y1="192" x2="784" y2="192"/><line x1="560" y1="220" x2="784" y2="220"/>
    <line x1="560" y1="248" x2="784" y2="248"/><line x1="560" y1="276" x2="784" y2="276"/><line x1="560" y1="304" x2="784" y2="304"/>
  </g>
  <rect x="616" y="136" width="28" height="28" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="630" y="128" font-size="10" fill="#276749" text-anchor="middle">1 thread</text>
  <text x="672" y="330" font-size="12" fill="#1a202c" text-anchor="middle">1 thread ⇒ 1 column (x, y)</text>

  <!-- mapping formulas -->
  <rect x="520" y="352" width="330" height="98" rx="6" fill="#f7fafc" stroke="#cbd5e0"/>
  <text x="534" y="374" font-size="12.5" fill="#1a202c">gx = baseX + gl_GlobalInvocationID.x</text>
  <text x="534" y="392" font-size="12.5" fill="#1a202c">gy = baseY + gl_GlobalInvocationID.y</text>
  <text x="534" y="414" font-size="12.5" fill="#2c5282">dispatch = ⌈bboxW / 8⌉ × ⌈bboxH / 8⌉ workgroups</text>
  <text x="534" y="434" font-size="11.5" fill="#718096">local_size = (8, 8, 1);  early return if gx≥W or gy≥H</text>

  <!-- arrow left->right -->
  <path d="M300,196 C360,196 430,150 512,150" fill="none" stroke="#a0aec0" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a5)"/>
  <text x="405" y="140" font-size="10" fill="#718096" text-anchor="middle">tiled into 8×8 workgroups</text>
  <defs><marker id="a5" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#a0aec0"/></marker></defs>
</svg>
