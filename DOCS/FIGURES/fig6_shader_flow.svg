  <title
     id="title1">Figure 6 - Per-thread control flow of subtract_swept.comp</title>
  <desc
     id="desc1">The eight numbered steps of section 4.4, run independently by one GPU thread per column: identify and bounds-check the column, read it, bound the sub-step range, accumulate the Z-envelope, the tube-pruning early-out, the two-pointer merge, the write-back, and the optional removal counter. Two exits leave the flow without writing.</desc>
  <!-- ============================================================
       EDIT HERE: colours and fonts in the style block below.
       Main column: x = 40, width 360, centre 220.
       Side exits:  x = 442, width 218, centre 551.
       Step badges sit on the left border of each main box.
       The numbering follows the steps of §4.4 one to one.
       ============================================================ -->
  <style
     id="style1">
    text          { fill: #1f2937; }
    .title        { font-size: 16px; font-weight: 700; }
    .subtitle     { font-size: 11.5px; fill: #5b7fa6; }
    .compute      { fill: #eef5fd; stroke: #1a73c8; stroke-width: 1.5; }
    .compute-opt  { fill: #eef5fd; stroke: #1a73c8; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .branch       { fill: #fffaf2; stroke: #e8710a; stroke-width: 1.6; }
    .exit         { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.4; }
    .exit-green   { fill: #eaf7ee; stroke: #3a9d4a; stroke-width: 1.6; }
    .done         { fill: #eceff3; stroke: #7a8ca0; stroke-width: 1.4; }
    .badge        { fill: #ffffff; stroke: #4b5563; stroke-width: 1.2; }
    .badge-t      { font-size: 11px; font-weight: 700; fill: #374151; }
    .flow         { stroke: #4b5563; stroke-width: 1.4; fill: none; }
    .head         { font-size: 12.5px; font-weight: 700; }
    .sub          { font-size: 11px; fill: #4b5563; }
    .mono         { font-size: 10.5px; font-family: &quot;DejaVu Sans Mono&quot;, Consolas, monospace; fill: #374151; }
    .sym          { font-size: 12.5px; font-weight: 700; font-family: &quot;DejaVu Sans&quot;, Helvetica, sans-serif; }
    .sym-sub      { font-size: 11px; fill: #4b5563; font-family: &quot;DejaVu Sans&quot;, Helvetica, sans-serif; }
    .yes          { font-size: 10.5px; font-weight: 700; fill: #b45309; }
    .no           { font-size: 10.5px; font-weight: 700; fill: #4b5563; }
    .note         { font-size: 10.5px; fill: #6b7280; }
  </style>
  <defs
     id="defs1">
    <marker
       id="a"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="6"
       markerHeight="6"
       orient="auto-start-reverse">
      <path
         d="M 0,0 10,5 0,10 Z"
         fill="#4b5563"
         id="path1" />
    </marker>
  </defs>
  <!-- ===================== TITLE ===================== -->
  <!-- ===================== FLOW ARROWS ===================== -->
  <g
     id="arrows"
     class="flow"
     transform="translate(-22.4,-83.25)">
    <path
       d="m 220,138 v 18"
       marker-end="url(#a)"
       id="path2" />
    <path
       d="m 220,196 v 18"
       marker-end="url(#a)"
       id="path3" />
    <path
       d="m 220,262 v 18"
       marker-end="url(#a)"
       id="path4" />
    <path
       d="m 220,328 v 18"
       marker-end="url(#a)"
       id="path5" />
    <path
       d="m 220,406 v 18"
       marker-end="url(#a)"
       id="path6" />
    <path
       d="m 220,488 v 18"
       marker-end="url(#a)"
       id="path7" />
    <path
       d="m 220,554 v 18"
       marker-end="url(#a)"
       id="path8" />
    <path
       d="m 220,620 v 18"
       marker-end="url(#a)"
       id="path9" />
    <path
       d="m 220,686 v 18"
       marker-end="url(#a)"
       id="path10" />
    <path
       d="m 400,176 h 42"
       marker-end="url(#a)"
       id="path11" />
    <path
       d="m 400,456 h 42"
       marker-end="url(#a)"
       id="path12" />
  </g>
  <!-- ===================== STEP 1 ===================== -->
  <rect
     class="compute"
     x="17.6"
     y="6.75"
     width="360"
     height="48"
     rx="5"
     id="rect12" />
  <text
     class="head"
     x="197.60001"
     y="26.75"
     text-anchor="middle"
     id="text12">identify the column</text>
  <text
     class="mono"
     x="197.60001"
     y="44.75"
     text-anchor="middle"
     id="text13">gx = baseX + id.x, gy = baseY + id.y</text>
  <circle
     class="badge"
     cx="17.6"
     cy="30.75"
     r="11"
     id="circle13" />
  <text
     class="badge-t"
     x="17.6"
     y="34.75"
     text-anchor="middle"
     id="text14">1</text>
  <!-- bounds check -->
  <rect
     class="branch"
     x="17.6"
     y="72.75"
     width="360"
     height="40"
     rx="5"
     id="rect14" />
  <text
     class="sym"
     x="197.60001"
     y="97.75"
     text-anchor="middle"
     id="text15">gx ≥ W or gy ≥ H ?</text>
  <text
     class="no"
     x="205.60001"
     y="125.75"
     id="text16">no</text>
  <text
     class="yes"
     x="395.60001"
     y="87.75"
     text-anchor="middle"
     id="text17">yes</text>
  <rect
     class="exit"
     x="419.60001"
     y="72.75"
     width="218"
     height="40"
     rx="5"
     id="rect17" />
  <text
     class="head"
     x="528.59998"
     y="97.75"
     text-anchor="middle"
     id="text18">return</text>
  <text
     class="note"
     x="528.59998"
     y="130.75"
     text-anchor="middle"
     id="text19">the workgroup rounding overhang,</text>
  <text
     class="note"
     x="528.59998"
     y="144.75"
     text-anchor="middle"
     id="text20">past the edge of the workpiece (§4.3)</text>
  <!-- ===================== STEP 2 ===================== -->
  <rect
     class="compute"
     x="17.6"
     y="130.75"
     width="360"
     height="48"
     rx="5"
     id="rect20" />
  <text
     class="head"
     x="197.60001"
     y="150.75"
     text-anchor="middle"
     id="text21">read the stock column</text>
  <text
     class="sub"
     x="197.60001"
     y="168.75"
     text-anchor="middle"
     id="text22">count from obj1_dataNum, transitions from obj1_flat</text>
  <circle
     class="badge"
     cx="17.6"
     cy="154.75"
     r="11"
     id="circle22" />
  <text
     class="badge-t"
     x="17.6"
     y="158.75"
     text-anchor="middle"
     id="text23">2</text>
  <!-- ===================== STEP 3 ===================== -->
  <rect
     class="compute"
     x="17.6"
     y="196.75"
     width="360"
     height="48"
     rx="5"
     id="rect23" />
  <text
     class="head"
     x="197.60001"
     y="216.75"
     text-anchor="middle"
     id="text24">bound the sub-step range [k0, k1]</text>
  <text
     class="sub"
     x="197.60001"
     y="234.75"
     text-anchor="middle"
     id="text25">the sub-positions that can cover this column (§3.4)</text>
  <circle
     class="badge"
     cx="17.6"
     cy="220.75"
     r="11"
     id="circle25" />
  <text
     class="badge-t"
     x="17.6"
     y="224.75"
     text-anchor="middle"
     id="text26">3</text>
  <!-- ===================== STEP 4 ===================== -->
  <rect
     class="compute"
     x="17.6"
     y="262.75"
     width="360"
     height="60"
     rx="5"
     id="rect26" />
  <text
     class="head"
     x="197.60001"
     y="282.75"
     text-anchor="middle"
     id="text27">accumulate the Z-envelope (§3.3)</text>
  <text
     class="sub"
     x="197.60001"
     y="300.75"
     text-anchor="middle"
     id="text28">for k in [k0, k1]: zbMin = min of bottoms,</text>
  <text
     class="sub"
     x="197.60001"
     y="314.75"
     text-anchor="middle"
     id="text29">ztMax = max of tops, kept in registers</text>
  <circle
     class="badge"
     cx="17.6"
     cy="292.75"
     r="11"
     id="circle29" />
  <text
     class="badge-t"
     x="17.6"
     y="296.75"
     text-anchor="middle"
     id="text30">4</text>
  <!-- ===================== STEP 5: the early-out ===================== -->
  <rect
     class="branch"
     x="17.6"
     y="340.75"
     width="360"
     height="64"
     rx="5"
     id="rect30" />
  <text
     class="head"
     x="197.60001"
     y="360.75"
     text-anchor="middle"
     id="text31">tube-pruning early-out (§3.6)</text>
  <text
     class="sub"
     x="197.60001"
     y="378.75"
     text-anchor="middle"
     id="text32">the tool never covered the column, or</text>
  <text
     class="sym-sub"
     x="197.60001"
     y="394.75"
     text-anchor="middle"
     id="text33">[zbMin, ztMax] lies outside [0, z1) ?</text>
  <circle
     class="badge"
     cx="17.6"
     cy="372.75"
     r="11"
     id="circle33" />
  <text
     class="badge-t"
     x="17.6"
     y="376.75"
     text-anchor="middle"
     id="text34">5</text>
  <text
     class="no"
     x="205.60001"
     y="417.75"
     id="text35">no</text>
  <text
     class="yes"
     x="395.60001"
     y="367.75"
     text-anchor="middle"
     id="text36">yes</text>
  <rect
     class="exit-green"
     x="419.60001"
     y="352.75"
     width="218"
     height="40"
     rx="5"
     id="rect36" />
  <text
     class="head"
     x="528.59998"
     y="377.75"
     text-anchor="middle"
     id="text37">return, nothing written</text>
  <text
     class="note"
     x="528.59998"
     y="410.75"
     text-anchor="middle"
     id="text38">the column is already correct,</text>
  <text
     class="note"
     x="528.59998"
     y="424.75"
     text-anchor="middle"
     id="text39">so its write traffic vanishes</text>
  <!-- ===================== STEP 6 ===================== -->
  <rect
     class="compute"
     x="17.6"
     y="422.75"
     width="360"
     height="48"
     rx="5"
     id="rect39" />
  <text
     class="head"
     x="197.60001"
     y="442.75"
     text-anchor="middle"
     id="text40">subtract</text>
  <text
     class="sub"
     x="197.60001"
     y="460.75"
     text-anchor="middle"
     id="text41">two-pointer merge of the column with [zbMin, ztMax]</text>
  <circle
     class="badge"
     cx="17.6"
     cy="446.75"
     r="11"
     id="circle41" />
  <text
     class="badge-t"
     x="17.6"
     y="450.75"
     text-anchor="middle"
     id="text42">6</text>
  <!-- ===================== STEP 7 ===================== -->
  <rect
     class="compute"
     x="17.6"
     y="488.75"
     width="360"
     height="48"
     rx="5"
     id="rect42" />
  <text
     class="head"
     x="197.60001"
     y="508.75"
     text-anchor="middle"
     id="text43">write back in place, store the new count</text>
  <text
     class="sub"
     x="197.60001"
     y="526.75"
     text-anchor="middle"
     id="text44">the trailing zero-fill of unused slots is optional (§6.4)</text>
  <circle
     class="badge"
     cx="17.6"
     cy="512.75"
     r="11"
     id="circle44" />
  <text
     class="badge-t"
     x="17.6"
     y="516.75"
     text-anchor="middle"
     id="text45">7</text>
  <!-- ===================== STEP 8 ===================== -->
  <rect
     class="compute-opt"
     x="17.6"
     y="554.75"
     width="360"
     height="48"
     rx="5"
     id="rect45" />
  <text
     class="head"
     x="197.60001"
     y="574.75"
     text-anchor="middle"
     id="text46">optional removal counter</text>
  <text
     class="mono"
     x="197.60001"
     y="592.75"
     text-anchor="middle"
     id="text47">atomicAdd(removed[seg], oldSolid - newSolid)</text>
  <circle
     class="badge"
     cx="17.6"
     cy="578.75"
     r="11"
     id="circle47" />
  <text
     class="badge-t"
     x="17.6"
     y="582.75"
     text-anchor="middle"
     id="text48">8</text>
  <!-- ===================== DONE ===================== -->
  <rect
     class="done"
     x="97.599998"
     y="620.75"
     width="200"
     height="32"
     rx="16"
     id="rect48" />
  <text
     class="head"
     x="197.60001"
     y="641.75"
     text-anchor="middle"
     id="text49">column done</text>
  <!-- ===================== LEGEND ===================== -->
  <g
     id="legend"
     transform="translate(-22.4,-83.25)">
    <rect
       class="compute"
       x="40"
       y="758"
       width="14"
       height="14"
       rx="3"
       id="rect49" />
    <text
       class="note"
       x="60"
       y="769"
       id="text50">compute step</text>
    <rect
       class="branch"
       x="170"
       y="758"
       width="14"
       height="14"
       rx="3"
       id="rect50" />
    <text
       class="note"
       x="190"
       y="769"
       id="text51">branch</text>
    <rect
       class="exit-green"
       x="262"
       y="758"
       width="14"
       height="14"
       rx="3"
       id="rect51" />
    <text
       class="note"
       x="282"
       y="769"
       id="text52">the early-out added by §3.6, which removes the write of step 7</text>
  </g>
  <text
     class="note"
     x="17.6"
     y="708.75"
     id="text53">Steps 5 and 7 are where this work differs from the straightforward swept kernel; the rest is the standard per-column merge.</text>
