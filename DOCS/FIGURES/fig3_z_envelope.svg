  <title
     id="title1">Figure 3 - The per-column Z-envelope</title>
  <desc
     id="desc1">Left: section through the tool axis, the ball-end mill at three sub-positions over one fixed stock column; each sub-position gives its own hemisphere bottom on that column, the deepest occurring when the axis passes over it. Centre: each sub-position contributes one Z-interval from its bottom up to the shank top; the intervals overlap, so their union is again a single interval, the envelope. Right: the envelope is subtracted from the stock column in place, the shank-top transition being clamped away because it lies above the stock.</desc>
  <!-- ============================================================
       EDIT HERE: colours and fonts in the style block below.
       The three panels share one vertical Z scale (canvas y):
         y = 140  shank top          y = 180  z_top (stock surface)
         y = 275  zbMin (deepest)    y = 330  z = 0 (stock base)
       Tool: R = 30, hemisphere centre y = 245, sub-positions at
       x = 182 (offset 28), 210 (on axis), 234 (offset 24).
       Bottom on the column = 245 + sqrt(R^2 - offset^2).
       ============================================================ -->
  <style
     id="style1">
    text          { fill: #1f2937; }
    .title        { font-size: 17px; font-weight: 700; }
    .subtitle     { font-size: 12px; fill: #5b7fa6; }
    .panel        { fill: #f2f7fc; stroke: #dbe6f0; stroke-width: 1; }
    .ptitle       { font-size: 12.5px; font-weight: 700; fill: #1f2937; }
    .stock        { fill: #b7e3bd; fill-opacity: 0.75; stroke: #3a9d4a; stroke-width: 1.4; }
    .tool-ghost   { fill: #e8710a; fill-opacity: 0.05; stroke: #e8710a; stroke-width: 1; stroke-opacity: 0.5; }
    .tool-solid   { fill: #f6c08a; fill-opacity: 0.55; stroke: #e8710a; stroke-width: 1.5; }
    .colstrip     { fill: #4a90e2; fill-opacity: 0.30; stroke: #1a73c8; stroke-width: 0.8; }
    .guide        { stroke: #8a97a4; stroke-width: 1; stroke-dasharray: 5 4; fill: none; }
    .axis         { stroke: #7a8ca0; stroke-width: 1.2; fill: none; }
    .node         { fill: #1a73c8; }
    .node-deep    { fill: #1a4fb0; }
    .bar-int      { fill: #f6c08a; fill-opacity: 0.75; stroke: #e8710a; stroke-width: 1.2; }
    .bar-env      { fill: #bcd8f5; fill-opacity: 0.9; stroke: #1a73c8; stroke-width: 1.6; }
    .bar-env-cut  { fill: #bcd8f5; fill-opacity: 0.35; stroke: #1a73c8; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .bar-stock    { fill: #b7e3bd; fill-opacity: 0.9; stroke: #3a9d4a; stroke-width: 1.6; }
    .op           { font-size: 20px; fill: #4b5563; }
    .lbl          { font-size: 11.5px; fill: #374151; }
    .lbl-b        { font-size: 11.5px; font-weight: 700; fill: #1a4fb0; }
    .lbl-o        { font-size: 11.5px; font-weight: 700; fill: #e8710a; }
    .note         { font-size: 11px; fill: #6b7280; }
    .sym          { font-family: &quot;DejaVu Sans&quot;, Helvetica, sans-serif; font-size: 11.5px; fill: #374151; }
  </style>
  <defs
     id="defs2">
    <marker
       id="ax"
       viewBox="0 0 10 10"
       refX="8"
       refY="5"
       markerWidth="6"
       markerHeight="6"
       orient="auto-start-reverse">
      <path
         d="M 0,0 10,5 0,10 Z"
         fill="#7a8ca0"
         id="path1" />
    </marker>
    <marker
       id="lead"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="5"
       markerHeight="5"
       orient="auto-start-reverse">
      <path
         d="M 0,0 10,5 0,10 Z"
         fill="#6b7280"
         id="path2" />
    </marker>
  </defs>
  <!-- ===================== TITLE ===================== -->
  <!-- ============ PANEL A: geometry, section through the tool axis ============ -->
  <g
     id="panel-geometry"
     transform="translate(-21.5,-69.5)">
    <rect
       class="panel"
       x="28"
       y="76"
       width="360"
       height="330"
       rx="4"
       id="rect3" />
    <text
       class="ptitle"
       x="208"
       y="100"
       text-anchor="middle"
       id="text4">The tool at three sub-steps, seen in section</text>
    <!-- Z axis -->
    <line
       class="axis"
       x1="38"
       y1="330"
       x2="38"
       y2="150"
       marker-end="url(#ax)"
       id="line4" />
    <text
       class="lbl"
       x="38"
       y="144"
       text-anchor="middle"
       id="text5">Z</text>
    <!-- stock -->
    <rect
       class="stock"
       x="52"
       y="180"
       width="320"
       height="150"
       id="rect5" />
    <!-- tool at three sub-positions; the middle one is on the column axis -->
    <path
       class="tool-ghost"
       d="m 152,140 v 105 a 30,30 0 0 0 60,0 V 140 Z"
       id="path5" />
    <path
       class="tool-ghost"
       d="m 204,140 v 105 a 30,30 0 0 0 60,0 V 140 Z"
       id="path6" />
    <path
       class="tool-solid"
       d="m 180,140 v 105 a 30,30 0 0 0 60,0 V 140 Z"
       id="path7" />
    <!-- the column under study, drawn over the tools -->
    <rect
       class="colstrip"
       x="206"
       y="180"
       width="8"
       height="150"
       id="rect7" />
    <!-- where each sub-position meets the column -->
    <circle
       class="node"
       cx="210"
       cy="255.8"
       r="3"
       id="circle7" />
    <circle
       class="node"
       cx="210"
       cy="263"
       r="3"
       id="circle8" />
    <circle
       class="node-deep"
       cx="210"
       cy="275"
       r="4.5"
       id="circle9" />
    <!-- shared Z guides -->
    <line
       class="guide"
       x1="152"
       y1="140"
       x2="366"
       y2="140"
       id="line9" />
    <line
       class="guide"
       x1="52"
       y1="180"
       x2="366"
       y2="180"
       id="line10" />
    <line
       class="guide"
       x1="210"
       y1="275"
       x2="366"
       y2="275"
       id="line11" />
    <text
       class="lbl"
       x="366"
       y="136"
       text-anchor="end"
       id="text11">shankTop - above the stock</text>
    <text
       class="lbl"
       x="366"
       y="176"
       text-anchor="end"
       id="text12">z_top</text>
    <text
       class="lbl-b"
       x="366"
       y="271"
       text-anchor="end"
       id="text13">zbMin</text>
    <text
       class="lbl"
       x="366"
       y="326"
       text-anchor="end"
       id="text14">z = 0</text>
    <!-- sub-step ticks -->
    <g
       id="substeps">
      <line
         class="axis"
         x1="182"
         y1="336"
         x2="182"
         y2="344"
         id="line14" />
      <line
         class="axis"
         x1="210"
         y1="336"
         x2="210"
         y2="344"
         id="line15" />
      <line
         class="axis"
         x1="234"
         y1="336"
         x2="234"
         y2="344"
         id="line16" />
      <text
         class="sym"
         x="182"
         y="358"
         text-anchor="middle"
         id="text16">k₀</text>
      <text
         class="sym"
         x="210"
         y="358"
         text-anchor="middle"
         id="text17">k*</text>
      <text
         class="sym"
         x="234"
         y="358"
         text-anchor="middle"
         id="text18">k₁</text>
      <text
         class="note"
         x="208"
         y="376"
         text-anchor="middle"
         id="text19">tool reference point at the sub-steps that cover this column</text>
    </g>
    <text
       class="note"
       x="208"
       y="394"
       text-anchor="middle"
       id="text20">each meets the column at its own bottom; the deepest is zbMin</text>
  </g>
  <!-- ============ PANEL B: one interval per sub-step, union = envelope ============ -->
  <g
     id="panel-intervals"
     transform="translate(-21.5,-69.5)">
    <rect
       class="panel"
       x="400"
       y="76"
       width="200"
       height="330"
       rx="4"
       id="rect20" />
    <text
       class="ptitle"
       x="500"
       y="100"
       text-anchor="middle"
