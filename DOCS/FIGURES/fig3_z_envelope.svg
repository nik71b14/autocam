    <line
       class="guide"
       x1="624"
       y1="180"
       x2="820"
       y2="180"
       id="line35" />
    <line
       class="guide"
       x1="624"
       y1="275"
       x2="820"
       y2="275"
       id="line36" />
    <!-- before: the whole stock column -->
    <rect
       class="bar-stock"
       x="634"
       y="180"
       width="30"
       height="150"
       id="rect36" />
    <text
       class="lbl"
       x="649"
       y="348"
       text-anchor="middle"
       id="text36">[0, z_top]</text>
    <text
       class="note"
       x="649"
       y="366"
       text-anchor="middle"
       id="text37">before</text>
    <text
       class="op"
       x="688"
       y="262"
       text-anchor="middle"
       id="text38">−</text>
    <!-- the envelope, its top part above the stock and therefore clamped -->
    <rect
       class="bar-env-cut"
       x="707"
       y="140"
       width="30"
       height="40"
       id="rect38" />
    <rect
       class="bar-env"
       x="707"
       y="180"
       width="30"
       height="95"
       id="rect39" />
    <text
       class="lbl"
       x="722"
       y="348"
       text-anchor="middle"
       id="text39">envelope</text>
    <text
       class="note"
       x="722"
       y="366"
       text-anchor="middle"
       id="text40">clamped</text>
    <text
       class="op"
       x="761"
       y="262"
       text-anchor="middle"
       id="text41">=</text>
    <!-- after -->
    <rect
       class="bar-stock"
       x="780"
       y="275"
       width="30"
       height="55"
       id="rect41" />
    <text
       class="lbl"
       x="795"
       y="348"
       text-anchor="middle"
       id="text42">[0, zbMin]</text>
    <text
       class="note"
       x="795"
       y="366"
       text-anchor="middle"
       id="text43">after</text>
    <text
       class="note"
       x="722"
       y="388"
       text-anchor="middle"
       id="text44">one two-pointer merge, written</text>
    <text
       class="note"
       x="722"
       y="402"
       text-anchor="middle"
       id="text45">back into the same slots</text>
  </g>
