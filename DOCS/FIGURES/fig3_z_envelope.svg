       x1="412"
       y1="140"
       x2="588"
       y2="140"
       id="line21" />
    <line
       class="guide"
       x1="412"
       y1="275"
       x2="588"
       y2="275"
       id="line22" />
    <!-- one interval per sub-step: [bottom(k), shankTop] -->
    <rect
       class="bar-int"
       x="424"
       y="140"
       width="16"
       height="115.8"
       id="rect22" />
    <rect
       class="bar-int"
       x="452"
       y="140"
       width="16"
       height="135"
       id="rect23" />
    <rect
       class="bar-int"
       x="480"
       y="140"
       width="16"
       height="123"
       id="rect24" />
    <text
       class="sym"
       x="432"
       y="298"
       text-anchor="middle"
       id="text24">k₀</text>
    <text
       class="sym"
       x="460"
       y="298"
       text-anchor="middle"
       id="text25">k*</text>
    <text
       class="sym"
       x="488"
       y="298"
       text-anchor="middle"
       id="text26">k₁</text>
    <text
       class="op"
       x="522"
       y="212"
       text-anchor="middle"
       id="text27">=</text>
    <text
       class="note"
       x="500"
       y="122"
       text-anchor="middle"
       id="text28">their union</text>
    <!-- their union: still a single interval -->
    <rect
       class="bar-env"
       x="546"
       y="140"
       width="26"
       height="135"
       id="rect28" />
    <text
       class="lbl-b"
       x="559"
       y="298"
       text-anchor="middle"
       id="text29">envelope</text>
    <text
       class="lbl"
       x="500"
       y="328"
       text-anchor="middle"
       id="text30">[zbMin, shankTop]</text>
    <text
       class="note"
       x="500"
       y="352"
       text-anchor="middle"
       id="text31">the tool moves ≤ 1 voxel per</text>
    <text
       class="note"
       x="500"
       y="366"
       text-anchor="middle"
       id="text32">sub-step, so the intervals overlap</text>
    <text
       class="note"
       x="500"
       y="380"
       text-anchor="middle"
       id="text33">and their union is one interval:</text>
    <text
       class="note"
       x="500"
       y="394"
       text-anchor="middle"
       id="text34">min of bottoms, max of tops</text>
  </g>
