<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="860" height="430" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="bold" fill="#1a202c">Z-transition column representation (single-axis dexel)</text>

  <!-- ===================== LEFT: X-Z cross section ===================== -->
  <rect x="40" y="70" width="360" height="320" fill="#f7fafc" stroke="#cbd5e0"/>
  <text x="220" y="90" font-size="13" fill="#4a5568" text-anchor="middle">X–Z cross-section of the stock</text>

  <line x1="80" y1="360" x2="380" y2="360" stroke="#718096" stroke-width="1.5"/>
  <line x1="80" y1="360" x2="80" y2="110" stroke="#718096" stroke-width="1.5"/>
  <text x="384" y="364" font-size="13" fill="#4a5568">X</text>
  <text x="72" y="106" font-size="13" fill="#4a5568">Z</text>
  <text x="66" y="364" font-size="12" fill="#4a5568" text-anchor="end">0</text>

  <path d="M80,360 L80,200
           C140,175 175,150 220,190
           C255,222 300,150 360,175
           L360,360 Z"
        fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="300" y="330" font-size="13" fill="#276749">solid</text>

  <rect x="212" y="110" width="16" height="250" fill="#dbeafe"/>
  <line x1="220" y1="110" x2="220" y2="360" stroke="#2b6cb0" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="220" y="126" font-size="12" fill="#2b6cb0" text-anchor="middle">column (x,y)</text>

  <circle cx="220" cy="360" r="5" fill="#2b6cb0"/>
  <circle cx="220" cy="189" r="5" fill="#2b6cb0"/>
  <text x="234" y="356" font-size="12" fill="#1a202c">transition: z = 0  (enter solid)</text>
  <text x="234" y="186" font-size="12" fill="#1a202c">transition: z = 415  (exit)</text>

  <text x="80" y="384" font-size="11" fill="#718096">→ voxels 0..414 are solid; empty above</text>

  <!-- ===================== RIGHT: encoding ===================== -->
  <text x="440" y="96" font-size="14" font-weight="bold" fill="#1a202c">Encoding: two flat arrays</text>

  <text x="440" y="124" font-size="13" fill="#4a5568">compressedData  (all transitions concatenated)</text>
  <g font-size="13" fill="#1a202c">
    <rect x="440" y="132" width="46" height="30" fill="#edf2f7" stroke="#a0aec0"/><text x="463" y="152" text-anchor="middle">…</text>
    <rect x="486" y="132" width="46" height="30" fill="#bee3f8" stroke="#2b6cb0"/><text x="509" y="152" text-anchor="middle">0</text>
    <rect x="532" y="132" width="46" height="30" fill="#bee3f8" stroke="#2b6cb0"/><text x="555" y="152" text-anchor="middle">415</text>
    <rect x="578" y="132" width="46" height="30" fill="#edf2f7" stroke="#a0aec0"/><text x="601" y="152" text-anchor="middle">…</text>
  </g>
  <text x="509" y="180" font-size="11" fill="#2b6cb0" text-anchor="middle">↑ the highlighted column: [0, 415]</text>

  <text x="440" y="214" font-size="13" fill="#4a5568">prefixSumData[i]  (start offset of column i = x + y·W)</text>
  <g font-size="13" fill="#1a202c">
    <rect x="440" y="222" width="46" height="30" fill="#edf2f7" stroke="#a0aec0"/><text x="463" y="242" text-anchor="middle">…</text>
    <rect x="486" y="222" width="46" height="30" fill="#feebc8" stroke="#dd6b20"/><text x="509" y="242" text-anchor="middle">k</text>
    <rect x="532" y="222" width="46" height="30" fill="#edf2f7" stroke="#a0aec0"/><text x="555" y="242" text-anchor="middle">…</text>
  </g>

  <rect x="440" y="278" width="380" height="46" rx="6" fill="#fffaf0" stroke="#dd6b20"/>
  <text x="452" y="298" font-size="13" fill="#1a202c">Occupancy (parity walk):</text>
  <text x="452" y="316" font-size="13" font-weight="bold" fill="#c05621">voxel z is solid  ⇔  (#transitions ≤ z) is odd</text>

  <rect x="440" y="332" width="380" height="62" rx="6" fill="#ebf8ff" stroke="#2b6cb0"/>
  <text x="452" y="352" font-size="13" fill="#1a202c">Key properties:</text>
  <text x="452" y="370" font-size="13" font-weight="bold" fill="#2c5282">memory ∝ surface, not volume</text>
  <text x="452" y="388" font-size="13" font-weight="bold" fill="#2c5282">Boolean = merge of sorted lists, per column</text>
</svg>
