<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="860" height="470" fill="#ffffff"/>
  <text x="30" y="32" font-size="20" font-weight="bold" fill="#1a202c">Per-column Z-envelope, computed on the fly (the core of the method)</text>

  <!-- ===================== LEFT: tool sub-positions over one column ===================== -->
  <rect x="30" y="56" width="470" height="384" rx="8" fill="#f7fafc" stroke="#cbd5e0"/>
  <text x="265" y="80" font-size="13" fill="#4a5568" text-anchor="middle">ball-end mill (hemisphere radius R=30 + shank) at 3 sub-positions</text>

  <!-- Z axis: z increases downward = deeper; tip z=450 at bottom -->
  <line x1="90" y1="120" x2="90" y2="415" stroke="#718096" stroke-width="1.4"/>
  <text x="84" y="204" font-size="12" fill="#4a5568" text-anchor="end">z=500</text>
  <text x="84" y="288" font-size="12" fill="#4a5568" text-anchor="end">z=480</text>
  <text x="84" y="414" font-size="12" fill="#4a5568" text-anchor="end">z=450</text>
  <text x="70" y="300" font-size="12" fill="#4a5568" transform="rotate(-90 70 300)" text-anchor="middle">Z (deeper →)</text>

  <!-- stock top line: above it is out of the workpiece -->
  <line x1="90" y1="200" x2="470" y2="200" stroke="#a0aec0" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="466" y="194" font-size="11" fill="#718096" text-anchor="end">stock top (z=500)</text>
  <text x="150" y="150" font-size="12" font-weight="bold" fill="#718096">shank → out of workpiece</text>

  <!-- target stock column gx=200 -->
  <rect x="256" y="200" width="18" height="215" fill="#dbeafe"/>
  <line x1="265" y1="120" x2="265" y2="415" stroke="#2b6cb0" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="265" y="112" font-size="12" fill="#2b6cb0" text-anchor="middle">column gx=200</text>

  <!-- three ball-end mills (hemisphere tip + shank), outline only -->
  <g fill="none">
    <path d="M165,120 L165,284 Q165,410 225,410 Q285,410 285,284 L285,120" stroke="#f6ad55" stroke-width="1.3"/>
    <path d="M245,120 L245,284 Q245,410 305,410 Q365,410 365,284 L365,120" stroke="#f6ad55" stroke-width="1.3"/>
    <path d="M205,120 L205,284 Q205,410 265,410 Q325,410 325,284 L325,120" stroke="#c05621" stroke-width="2.4"/>
  </g>
  <text x="265" y="300" font-size="11" fill="#c05621" text-anchor="middle">axis</text>

  <!-- crossing markers of the column with each tool's hemisphere -->
  <circle cx="265" cy="387" r="4" fill="#a0aec0"/>
  <text x="238" y="380" font-size="11" fill="#718096" text-anchor="end">z≈456</text>
  <circle cx="265" cy="410" r="6" fill="#2b6cb0"/>

  <!-- min-bottom line -->
  <line x1="90" y1="410" x2="470" y2="410" stroke="#2b6cb0" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="100" y="432" font-size="13" font-weight="bold" fill="#2b6cb0">zbMin = min of the bottoms = 450</text>

  <!-- envelope bracket [450, shank top] -->
  <line x1="470" y1="135" x2="470" y2="410" stroke="#2b6cb0" stroke-width="2"/>
  <line x1="464" y1="135" x2="476" y2="135" stroke="#2b6cb0" stroke-width="2"/>
  <line x1="464" y1="410" x2="476" y2="410" stroke="#2b6cb0" stroke-width="2"/>
  <text x="491" y="272" font-size="12" font-weight="bold" fill="#2c5282" transform="rotate(-90 491 272)" text-anchor="middle">envelope [450, shank top]</text>

  <!-- ===================== RIGHT: the subtraction on the column ===================== -->
  <rect x="520" y="56" width="310" height="384" rx="8" fill="#f7fafc" stroke="#cbd5e0"/>
  <text x="675" y="80" font-size="14" font-weight="bold" fill="#1a202c" text-anchor="middle">Subtraction on column (200,100)</text>

  <!-- BEFORE bar -->
  <text x="545" y="118" font-size="13" fill="#4a5568">before</text>
  <rect x="545" y="128" width="56" height="228" fill="#c6f6d5" stroke="#38a169" stroke-width="1.6"/>
  <text x="608" y="140" font-size="12" fill="#276749">z=500</text>
  <text x="608" y="354" font-size="12" fill="#276749">z=0</text>
  <text x="573" y="250" font-size="12" fill="#276749" text-anchor="middle" transform="rotate(-90 573 244)">solid [0, 500]</text>

  <!-- minus -->
  <text x="636" y="238" font-size="24" fill="#c05621" text-anchor="middle">−</text>
  <text x="636" y="260" font-size="11" fill="#c05621" text-anchor="middle">tool</text>
  <text x="636" y="274" font-size="11" fill="#c05621" text-anchor="middle">[450, 760]</text>

  <!-- AFTER bar -->
  <text x="672" y="118" font-size="13" fill="#4a5568">after</text>
  <rect x="672" y="151" width="56" height="205" fill="#c6f6d5" stroke="#38a169" stroke-width="1.6"/>
  <rect x="672" y="128" width="56" height="23" fill="#feebc8" stroke="#dd6b20" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="735" y="140" font-size="12" fill="#c05621">z=500</text>
  <text x="735" y="156" font-size="11" fill="#c05621">z=450</text>
  <text x="735" y="354" font-size="12" fill="#276749">z=0</text>
  <text x="700" y="258" font-size="12" fill="#276749" text-anchor="middle" transform="rotate(-90 700 252)">solid [0, 450]</text>

  <rect x="536" y="372" width="288" height="56" rx="6" fill="#fffaf0" stroke="#dd6b20"/>
  <text x="680" y="392" font-size="11.5" fill="#1a202c" text-anchor="middle">tool top (760) is above the stock ⇒</text>
  <text x="680" y="408" font-size="11.5" font-weight="bold" fill="#c05621" text-anchor="middle">that transition is clamped / dropped</text>
  <text x="680" y="423" font-size="11.5" font-weight="bold" fill="#2c5282" text-anchor="middle">one kernel: envelope + in-place merge</text>

  <text x="100" y="458" font-size="11" fill="#718096">convex in Z  ⇒  each column is ONE interval  [hemisphere bottom, shank top]</text>
</svg>
