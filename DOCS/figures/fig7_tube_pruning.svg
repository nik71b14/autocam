<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="880" height="430" fill="#ffffff"/>
  <text x="30" y="32" font-size="20" font-weight="bold" fill="#1a202c">Tube pruning: dispatch AABB vs. the swept band</text>

  <!-- ========== LEFT: diagonal AABB vs tube ========== -->
  <text x="230" y="60" font-size="13" fill="#4a5568" text-anchor="middle">a long DIAGONAL segment (top view, X–Y)</text>
  <!-- AABB (dilated bbox of the endpoints) -->
  <rect x="90" y="80" width="290" height="280" fill="#edf2f7" stroke="#718096" stroke-width="1.6" stroke-dasharray="7 5"/>
  <!-- swept tube (band) -->
  <line x1="135" y1="125" x2="335" y2="315" stroke="#2b6cb0" stroke-width="52" stroke-linecap="round"/>
  <line x1="135" y1="125" x2="335" y2="315" stroke="#dbeafe" stroke-width="46" stroke-linecap="round"/>
  <!-- tool at ends -->
  <circle cx="135" cy="125" r="24" fill="none" stroke="#c05621" stroke-width="2"/>
  <circle cx="335" cy="315" r="24" fill="none" stroke="#c05621" stroke-width="2"/>
  <text x="120" y="118" font-size="11" fill="#c05621">p0</text>
  <text x="342" y="322" font-size="11" fill="#c05621">p1</text>
  <text x="238" y="222" font-size="12" font-weight="bold" fill="#2c5282" text-anchor="middle" transform="rotate(43 238 222)">swept tube — processed</text>
  <!-- off-tube callouts -->
  <text x="330" y="110" font-size="12" fill="#4a5568" text-anchor="middle">off-tube</text>
  <text x="330" y="125" font-size="11" fill="#718096" text-anchor="middle">no-op → skipped</text>
  <text x="150" y="345" font-size="12" fill="#4a5568" text-anchor="middle">off-tube</text>
  <line x1="330" y1="130" x2="340" y2="150" stroke="#a0aec0" stroke-width="1"/>
  <line x1="150" y1="332" x2="140" y2="315" stroke="#a0aec0" stroke-width="1"/>
  <!-- formulas -->
  <text x="90" y="384" font-size="12" fill="#718096">AABB ≈ (0.7·L + D)² columns   ·   tube ≈ L·D columns   (L = segment length, D = tool footprint)</text>

  <!-- ========== RIGHT: columns processed + air move ========== -->
  <text x="650" y="60" font-size="13" fill="#4a5568" text-anchor="middle">columns actually rewritten per segment</text>
  <!-- baseline bar -->
  <text x="470" y="104" font-size="12" fill="#1a202c">baseline (whole AABB)</text>
  <rect x="470" y="112" width="360" height="30" fill="#c05621"/>
  <text x="835" y="133" font-size="11" fill="#1a202c" text-anchor="end"> </text>
  <!-- tube bar -->
  <text x="470" y="168" font-size="12" fill="#1a202c">tube pruning (Step 1)</text>
  <rect x="470" y="176" width="86" height="30" fill="#2b6cb0"/>
  <text x="566" y="197" font-size="11" fill="#2c5282">only the band</text>

  <text x="470" y="238" font-size="12" fill="#718096">Same result, bit-exact: skipped columns are unchanged,</text>
  <text x="470" y="255" font-size="12" fill="#718096">so not writing them changes nothing.</text>

  <!-- air move box -->
  <rect x="470" y="278" width="378" height="96" rx="8" fill="#fffaf0" stroke="#dd6b20"/>
  <text x="486" y="300" font-size="13" font-weight="bold" fill="#c05621">In-air rapid (G0) move</text>
  <text x="486" y="322" font-size="12" fill="#1a202c">tool is above the stock ⇒ removed interval lies</text>
  <text x="486" y="340" font-size="12" fill="#1a202c">outside [0, z1) ⇒ EVERY column is skipped</text>
  <text x="486" y="360" font-size="12" font-weight="bold" fill="#2c5282">⇒ the move becomes almost free (~7.6× here)</text>
</svg>
